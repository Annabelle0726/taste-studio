<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>找到你想留下的细节</title><desc>花店设计流程的示意排版，图像素材来自本项目。</desc><rect width="960" height="600" fill="#faf5eb"/><g font-family="SimSun,serif" fill="#30251f"><text x="58" y="66" font-size="23" fill="#8b7a70">写简报</text><text x="278" y="66" font-size="23" fill="#8b7a70">看草图</text><text x="498" y="66" font-size="23" fill="#83132e">选细节</text><text x="718" y="66" font-size="23" fill="#8b7a70">试页面</text><path d="M58 91 H902" stroke="#d8c6a9"/><path d="M498 91 h90" stroke="#83132e" stroke-width="3"/><text x="58" y="226" font-size="29" fill="#591026">找到你想留下的细节</text><text x="58" y="285" font-size="20">「我想留住花瓣边缘的水珠。」</text><text x="58" y="323" font-size="20">把原话和它指向的画面放在一起。</text><text x="58" y="532" font-size="20" fill="#6a5951">Taste Studio · 设计流程</text><image href="../../workflow-petal.webp" x="415" y="150" width="330" height="360" preserveAspectRatio="xMidYMid slice"/><rect x="725" y="356" width="185" height="185" fill="#faf5eb" stroke="#ae8753"/><image href="../../workflow-detail.webp" x="735" y="366" width="165" height="165"/><path d="M677 351 L735 366" stroke="#ae8753"/></g></svg>