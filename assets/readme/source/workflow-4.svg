<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>让细节走进真实页面</title><desc>花店设计流程的示意排版，图像素材来自本项目。</desc><rect width="960" height="600" fill="#faf5eb"/><g font-family="SimSun,serif" fill="#30251f"><text x="58" y="66" font-size="23" fill="#8b7a70">写简报</text><text x="278" y="66" font-size="23" fill="#8b7a70">看草图</text><text x="498" y="66" font-size="23" fill="#8b7a70">选细节</text><text x="718" y="66" font-size="23" fill="#83132e">试页面</text><path d="M58 91 H902" stroke="#d8c6a9"/><path d="M718 91 h90" stroke="#83132e" stroke-width="3"/><text x="58" y="226" font-size="29" fill="#591026">让细节走进真实页面</text><text x="58" y="285" font-size="20">水珠仍在，取花入口也找得到。</text><text x="58" y="323" font-size="20">试着点击，看看下一步是否清楚。</text><text x="58" y="532" font-size="20" fill="#6a5951">Taste Studio · 设计流程</text><rect x="430" y="132" width="220" height="390" rx="15" fill="#fffaf2" stroke="#d8c6a9"/><text x="450" y="166" font-size="20">花房</text><image href="../../workflow-detail.webp" x="440" y="184" width="200" height="220" preserveAspectRatio="xMidYMid slice"/><text x="450" y="438" font-size="22">今日洋牡丹</text><rect x="450" y="459" width="180" height="40" rx="3" fill="#83132e"/><text x="540" y="486" text-anchor="middle" fill="#faf5eb" font-size="19">到店取花 →</text><path d="M650 477 H682" stroke="#ae8753"/><rect x="682" y="310" width="220" height="212" fill="#fffaf2" stroke="#d8c6a9"/><text x="703" y="349" font-size="23">取花信息</text><text x="703" y="393" font-size="19">今日 18:00 前</text><text x="703" y="426" font-size="19">南街 12 号</text><path d="M702 451 H880" stroke="#d8c6a9"/><text x="703" y="488" font-size="19" fill="#83132e">已找到取花入口 ✓</text></g></svg>