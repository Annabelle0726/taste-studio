<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>同一简报，三种目光</title><desc>花店设计流程的示意排版，图像素材来自本项目。</desc><rect width="960" height="600" fill="#faf5eb"/><g font-family="SimSun,serif" fill="#30251f"><text x="58" y="66" font-size="23" fill="#8b7a70">写简报</text><text x="278" y="66" font-size="23" fill="#83132e">看草图</text><text x="498" y="66" font-size="23" fill="#8b7a70">选细节</text><text x="718" y="66" font-size="23" fill="#8b7a70">试页面</text><path d="M58 91 H902" stroke="#d8c6a9"/><path d="M278 91 h90" stroke="#83132e" stroke-width="3"/><text x="58" y="226" font-size="29" fill="#591026">同一简报，三种目光</text><text x="58" y="285" font-size="20">一朵花、一份花单、一家店。</text><text x="58" y="323" font-size="20">先比较，再决定从哪里开始。</text><text x="58" y="532" font-size="20" fill="#6a5951">Taste Studio · 设计流程</text><image href="../../sketch-bloom.png" x="412" y="166" width="156" height="270" preserveAspectRatio="xMidYMid meet"/><text x="490" y="478" text-anchor="middle" font-size="19">花瓣特写</text><image href="../../sketch-list.png" x="581" y="166" width="156" height="270" preserveAspectRatio="xMidYMid meet"/><text x="659" y="478" text-anchor="middle" font-size="19">花束清单</text><image href="../../sketch-pickup.png" x="750" y="166" width="156" height="270" preserveAspectRatio="xMidYMid meet"/><text x="828" y="478" text-anchor="middle" font-size="19">到店取花</text></g></svg>